services:
  agent:
    build:
      context: .
      dockerfile: Dockerfile
    working_dir: /workspace
    env_file:
      - .env
    environment:
      PYTHONPATH: /workspace/src
      GOOD_BOT_STATE_PATH: /tmp/good_bot/state.json
      GOOD_BOT_RUNTIME_DIR: /tmp/good_bot/runtime
      GOOD_BOT_WORKSPACE: /workspace
    user: "${GOOD_BOT_DOCKER_UID:-1000}:${GOOD_BOT_DOCKER_GID:-1000}"
    volumes:
      - ./:/workspace
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 1g
