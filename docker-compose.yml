services:
  agent:
    build:
      context: .
      dockerfile: Dockerfile
    working_dir: /workspace
    environment:
      GOOD_BOT_ENV_FILE: /run/config/good_bot.env
      GOOD_BOT_REPO_ROOT: /workspace/repo
      GOOD_BOT_IMAGE_REPO_PATH: /opt/good-bot-seed
      GOOD_BOT_REPO_URL: "${GOOD_BOT_REPO_URL:-}"
      GOOD_BOT_GIT_SET_REMOTE_WITH_TOKEN: "${GOOD_BOT_GIT_SET_REMOTE_WITH_TOKEN:-false}"
      GOOD_BOT_STATE_PATH: /tmp/good_bot/state.json
      GOOD_BOT_RUNTIME_DIR: /tmp/good_bot/runtime
      GOOD_BOT_WORKSPACE: /workspace/repo
    volumes:
      - ./.env:/run/config/good_bot.env:ro
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 1g
